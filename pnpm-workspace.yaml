packages:
  - packages/*
  - tools/*

allowBuilds:
  dprint: true

catalogMode: prefer
blockExoticSubdeps: true
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - "@typescript/*"
  - vite-plus
  - "@voidzero-dev/*"
  - oxlint
  - "@oxlint/*"
  - oxlint-tsgolint
  - "@oxlint-tsgolint/*"
  - oxfmt
  - "@oxfmt/*"
  - vitest
  - "@vitest/*"

catalog:
  "@changesets/cli": 3.0.3
  "@dprint/json": 0.25.1
  "@dprint/markdown": 0.26.0
  "@dprint/oxc": 0.43.0
  "@dprint/toml": 0.9.0
  "@types/node": 26.6.4
  "@typescript/native-preview": 7.0.0-dev.20260707.2
  cspell: 10.3.6
  dprint-plugin-yaml: 0.6.0
  dprint: 0.60.1
  pin-dependencies-checker: 2.7.1
  takua: 0.2.3
  tar: 7.5.22
  typescript: 7.0.2
  vite-plus: 1.0.0
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0

overrides:
  vite@*: "catalog:"

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
