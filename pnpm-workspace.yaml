packages:
  - packages/*
  - tools/*

catalogMode: prefer
blockExoticSubdeps: true
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - "@typescript/*"

catalog:
  "@changesets/cli": 2.31.1
  "@types/node": 25.9.5
  "@typescript/native-preview": 7.0.0-dev.20260707.2
  cspell: 10.0.1
  pin-dependencies-checker: 2.7.1
  tar: 7.5.20
  typescript: 7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@latest
  vitest: 4.1.10
  vite-plus: 0.2.4
  takua: 0.2.2

overrides:
  vite: "catalog:"
  vitest: "catalog:"

peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
