packages:
  - packages/*
  - tools/*

catalogMode: prefer
blockExoticSubdeps: true
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - "@typescript/*"

catalog:
  "@changesets/cli": 2.31.0
  "@types/node": 25.9.4
  "@typescript/native-preview": 7.0.0-dev.20260628.1
  cspell: 10.0.1
  pin-dependencies-checker: 2.7.1
  tar: 7.5.19
  typescript: 6.0.3
  vite: npm:@voidzero-dev/vite-plus-core@latest
  vitest: 4.1.9
  vite-plus: 0.2.1
  takua: 0.2.1

overrides:
  vite: "catalog:"
  vitest: "catalog:"

peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
